; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_flags =
    -I.pio/libdeps/seeed_xiao_esp32s3/Blynk/examples/Blynk.Edgent/Edgent_ESP32
lib_deps =
    blynkkk/Blynk @ 1.3.5
    bertmelis/espMqttClient @ 1.7.3

[env:native]
platform = native
test_framework = unity
build_src_filter =
    +<TelemetryPayload.cpp>

[env:seeed_xiao_esp32s3_test]
extends = env:seeed_xiao_esp32s3
test_framework = unity
test_build_src = yes
test_filter = test_telemetry
build_src_filter =
    +<TelemetryPayload.cpp>
